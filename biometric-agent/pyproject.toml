[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hrms-biometric-agent"
version = "1.0.0"
description = "Lightweight local biometric device communication agent for HRMS"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hrms-biometric-agent = "hrms_agent.cli:main"

[tool.setuptools.packages.find]
include = ["hrms_agent*"]
